<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | NOIRÉ</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        body { background: var(--bg-primary); display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { background: var(--bg-card); padding: 3rem; border: 1px solid var(--border-color); width: 100%; max-width: 400px; }
        input { width: 100%; padding: 12px; margin-bottom: 1rem; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--ivory); }
        button { width: 100%; padding: 12px; background: var(--gold); border: none; cursor: pointer; color: var(--text-dark); }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 style="margin-bottom: 2rem; text-align: center;">NOIRÉ Admin</h2>
        <form id="login-form">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <p id="error" style="color: red; margin-top: 1rem; text-align: center;"></p>
    </div>

    <script type="module">
        import { supabase } from '../assets/js/auth.js';

        const form = document.getElementById('login-form');
        form.onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                document.getElementById('error').textContent = error.message;
            } else {
                window.location.href = '/admin/index.html';
            }
        };
    </script>
</body>
</html>
