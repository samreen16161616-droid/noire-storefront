<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Collection | NOIRÉ PERFUMES</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .shop-page { padding-top: 150px; min-height: 100vh; background: var(--bg-primary); }
        .shop-header { text-align: center; margin-bottom: 5rem; padding: 0 2rem; }
        .shop-header h1 { font-size: 4.5rem; margin-bottom: 1.5rem; color: var(--ivory); }
        .shop-header p { color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto; }

        .filter-bar { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 4rem; flex-wrap: wrap; }
        .filter-btn { padding: 12px 30px; border: 1px solid var(--border-color); color: var(--text-muted); cursor: pointer; transition: 0.4s; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.15em; }
        .filter-btn.active, .filter-btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(216, 183, 117, 0.05); }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 3rem; max-width: 1400px; margin: 0 auto; padding: 0 3rem 6rem; }
        .product-item { background: var(--bg-card); border: 1px solid var(--border-color); padding: 1.5rem; transition: var(--transition); position: relative; }
        .product-item:hover { border-color: var(--gold); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

        .img-container { height: 450px; margin-bottom: 2rem; overflow: hidden; background: #0b1c14; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: 0.8s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .product-item:hover img { transform: scale(1.08); }

        .details h3 { font-size: 1.6rem; margin-bottom: 0.5rem; }
        .price { color: var(--gold); font-size: 1.2rem; display: block; margin-bottom: 1.5rem; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .btn-view { padding: 12px; border: 1px solid var(--gold); color: var(--gold); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.1em; cursor: pointer; transition: 0.3s; text-align: center; }
        .btn-view:hover { background: var(--gold); color: var(--text-dark); }
        .btn-add { padding: 12px; border: 1px solid var(--ivory); color: var(--ivory); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.1em; cursor: pointer; transition: 0.3s; }
        .btn-add:hover { background: var(--ivory); color: var(--text-dark); }
    </style>
</head>
<body>
    <div class="shop-page">
        <div class="shop-header">
            <h1>The Olfactory Vault</h1>
            <p>Our complete collection of handcrafted extraits.</p>
        </div>

        <div class="filter-bar" id="filters">
            <button class="filter-btn active" data-cat="All">All</button>
            <button class="filter-btn" data-cat="Men">Men</button>
            <button class="filter-btn" data-cat="Women">Women</button>
            <button class="filter-btn" data-cat="Unisex">Unisex</button>
        </div>

        <div class="product-grid" id="product-grid"></div>
    </div>

    <script type="module">
        import { fetchPublishedProducts } from './assets/js/api.js';
        import { renderHeaderFooter, addToCart } from './assets/js/components.js';
        renderHeaderFooter('shop');

        let products = [];
        try {
            products = await fetchPublishedProducts();
        } catch (e) {
            console.warn('Supabase fetch failed, falling back to local data:', e);
        }

        if (!products || products.length === 0) {
            const dataMod = await import('./assets/js/data.js');
            products = dataMod.products;
        }

        const grid = document.getElementById('product-grid');
        const render = (cat) => {
            const list = cat === 'All' ? products : products.filter(p => p.category === cat);
            grid.innerHTML = list.map(p => `
                <div class="product-item">
                    <div class="img-container"><img src="${p.image}" alt="${p.name}"></div>
                    <div class="details">
                        <h3>${p.name}</h3>
                        <span class="price">Rs. ${p.price.toLocaleString()}</span>
                        <div class="btn-group">
                            <a href="product.html?id=${p.id}" class="btn-view" style="text-align:center; padding-top:12px;">Details</a>
                            <button class="btn-add" onclick="window.addToCart('${p.id}')">Add to Bag</button>
                        </div>
                    </div>
                </div>
            `).join('');
        };

        window.addToCart = (id) => addToCart(id, '100ml', 1);

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                render(btn.dataset.cat);
            };
        });
        render('All');
    </script>
</body>
</html>
